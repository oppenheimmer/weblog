name: Cleanup old runs

on:
  schedule:
    # Every day at 03:00 JST (18:00 UTC)
    - cron: "0 18 * * *"

  # Also allow running it manually
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Purge old runs
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_CLEANUP_TOKEN }}
          KEEP_RUNS: "1"

        run: |
          set -euo pipefail

          repos=(
            "oppenheimmer/weblog"
          )

          for repo in "${repos[@]}"; do
            echo "Cleaning $repo"

            mapfile -t runs < <(
              gh run list \
                --repo "$repo" \
                --status completed \
                --limit 1000 \
                --json databaseId \
                --jq ".[$KEEP_RUNS:][].databaseId"
            )

            echo "Found ${#runs[@]} old runs to delete"

            for id in "${runs[@]}"; do
              echo "Deleting $repo run $id"
              gh run delete "$id" --repo "$repo"
            done
          done